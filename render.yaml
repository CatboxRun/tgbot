services:
  - type: worker
    name: liminal-tg-bot
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: OWNER_USERNAME
        sync: false
      - key: TARGET_CHAT
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      - key: LIM_PRICE_ENABLED
        value: "0"
